<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamKit · Estadísticas</title>
  <link rel="stylesheet" href="/assets/overlay.css">
</head>
<body data-channel="stats">
  <div class="stats-root">
    <div class="stat">
      <div class="stat-label">Espectadores</div>
      <div class="stat-value" id="stat-viewers">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Con puntos</div>
      <div class="stat-value" id="stat-points">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Eventos</div>
      <div class="stat-value" id="stat-events">0</div>
    </div>
    <div class="stat" style="display:none"></div>
  </div>
  <div class="stats-root" style="top:auto; bottom:24px;">
    <div class="stat" style="min-width:280px">
      <div class="stat-label">Top 3</div>
      <div class="stat-sub" id="stat-top">sin datos todavía</div>
    </div>
  </div>
  <script src="/assets/overlay.js"></script>
</body>
</html>
